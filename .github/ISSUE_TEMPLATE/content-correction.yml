name: Content correction
description: Correct or improve a sourced lesson, journey, checklist, or tool
title: "[CONTENT] "
labels: [content]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should change?
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      value: US-FAA
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Direct primary source
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed original wording or approach
      description: Do not paste copyrighted transcript/course material.
